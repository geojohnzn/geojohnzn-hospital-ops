<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: clinical workstation — fixed left rail of modules, scrolling work area; rail becomes a top strip on phones. */
:root {
  --bg: #F3F6F6; --surface: #FFFFFF; --surface-2: #E9EFEF; --line: #D5DFDF;
  --fg: #132325; --muted: #566A6C; --accent: #0A7570; --accent-soft: #D3ECEA; --on-accent: #FFFFFF;
  --wait: #C98A1E; --wait-soft: #F6E7C8; --good: #2D7D4F; --bad: #B83A2E; --info: #2C64A8;
  --good-soft: #DDF0E3; --bad-soft: #F6DEDA; --info-soft: #DCE8F6;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1617; --surface: #142022; --surface-2: #1A2A2C; --line: #29393C;
  --fg: #E2ECEC; --muted: #93A6A8; --accent: #3DB5AC; --accent-soft: #163837; --on-accent: #062221;
  --wait: #E2A84B; --wait-soft: #3A2E17; --good: #5CC78B; --bad: #EE7468; --info: #72A8EA;
  --good-soft: #17331F; --bad-soft: #3B1C19; --info-soft: #182B42; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1617; --surface: #142022; --surface-2: #1A2A2C; --line: #29393C;
  --fg: #E2ECEC; --muted: #93A6A8; --accent: #3DB5AC; --accent-soft: #163837; --on-accent: #062221;
  --wait: #E2A84B; --wait-soft: #3A2E17; --good: #5CC78B; --bad: #EE7468; --info: #72A8EA;
  --good-soft: #17331F; --bad-soft: #3B1C19; --info-soft: #182B42; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body) }
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .005em }
h1 { font-size: 1.5rem } h2 { font-size: 1.15rem } h3 { font-size: .95rem }
.mono, code, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 12.5px }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
a { color: var(--accent) }
button, select, input, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px }
.brand { display: flex; gap: 10px; align-items: center }
.brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); font-family: var(--font-head); font-size: 15px }
.brand b { display: block; font-family: var(--font-head); font-size: 15px; line-height: 1.2 }
.navgroup { display: flex; flex-direction: column; gap: 2px }
.navgroup .eyebrow { padding: 0 10px 4px }
.rail a.nav { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; text-decoration: none; color: var(--fg); white-space: nowrap }
.rail a.nav:hover { background: var(--surface-2) }
.rail a.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.rail .foot { margin-top: auto; font-size: 12px; color: var(--muted) }

main { min-width: 0; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
.pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap }
.pagehead p { margin: 4px 0 0; color: var(--muted); max-width: 70ch }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); white-space: nowrap }
.tag.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good) }
.tag.sim::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--wait) }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px }
.panel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)) }
.s4 { grid-column: span 4 } .s5 { grid-column: span 5 } .s6 { grid-column: span 6 } .s7 { grid-column: span 7 } .s8 { grid-column: span 8 } .s12 { grid-column: span 12 }
.chart { position: relative; height: 230px }
.chart.tall { height: 280px }

.tiles { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)) }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.tile .v { font-family: var(--font-data); font-size: 1.55rem; font-weight: 500; letter-spacing: -.01em; font-variant-numeric: tabular-nums }
.tile .v small { font-size: .9rem; color: var(--muted) }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted) }
.chip.good { background: var(--good-soft); color: var(--good) } .chip.bad { background: var(--bad-soft); color: var(--bad) }
.chip.warn { background: var(--wait-soft); color: var(--wait) } .chip.info { background: var(--info-soft); color: var(--info) }
.chip.accent { background: var(--accent-soft); color: var(--accent) }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-weight: 500; white-space: nowrap }
.btn:hover { background: var(--surface-2) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.primary:hover { filter: brightness(1.08) }
.btn:disabled { opacity: .5; cursor: not-allowed }
.btn.sm { padding: 4px 9px; font-size: 12.5px }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.spacer { flex: 1 }
input[type=text], input[type=search], input[type=date], input[type=time], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0 }
textarea { width: 100%; resize: vertical; line-height: 1.5 }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 500 }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
.tablewrap.scroll { max-height: 460px; overflow-y: auto }
table { width: 100%; border-collapse: collapse; font-size: 13px }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; z-index: 1; white-space: nowrap }
tr:last-child td { border-bottom: 0 }
tbody tr.click { cursor: pointer } tbody tr.click:hover { background: var(--surface-2) }
td.r, th.r { text-align: right }

.alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px }
.alerts li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: start }
.alerts li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--wait) }
.alerts li.bad::before { background: var(--bad) }

/* bed board */
.wards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)) }
.beds { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px }
.bed { border-radius: 7px; padding: 6px; font-size: 11.5px; line-height: 1.25; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; min-height: 50px }
.bed b { font-family: var(--font-data); font-weight: 500; display: block }
.bed.occ { background: var(--accent-soft); border-color: transparent }
.bed.dc { background: var(--wait-soft); border-color: var(--wait) }
.bed.clean { background: var(--info-soft); border-color: transparent }
.bed.free { background: var(--surface); border-style: dashed }
.bed.blocked { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface) 6px 12px) }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--line) }

/* scribe */
.scribe { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; align-items: start }
#transcript { min-height: 420px; font-size: 13.5px }
.partial { font-style: italic; color: var(--muted); min-height: 1.5em }
.soap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.soap label { display: flex; flex-direction: column; gap: 4px }
.soap textarea { min-height: 130px; font-size: 13px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.seg button { border: 0; background: var(--surface); padding: 6px 11px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.mic[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff }
.notice { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--muted) }
.notice.warn { border-color: var(--wait); background: var(--wait-soft); color: var(--fg) }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted) }

/* journey */
.ribbon { display: flex; height: 38px; border-radius: 7px; overflow: hidden; background: var(--surface-2) }
.ribbon > div { height: 100%; min-width: 2px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: var(--font-data); overflow: hidden; white-space: nowrap }
.ribbon .care { background: var(--accent); color: var(--on-accent) }
.ribbon .wt { background: repeating-linear-gradient(135deg, var(--wait-soft) 0 5px, transparent 5px 10px), var(--wait-soft); color: var(--wait); box-shadow: inset 0 0 0 1px var(--wait) }
.ribbonrow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 84px; gap: 10px; align-items: center }
.stages { display: flex; gap: 0; font-size: 11.5px; color: var(--muted) }
.stages span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 4px; border-left: 1px solid var(--line); padding-left: 4px }
.bigfig { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)) }
.bigfig div { display: flex; flex-direction: column; gap: 2px }
.bigfig b { font-family: var(--font-data); font-size: 1.35rem; font-weight: 500 }
input[type=range] { width: 100%; accent-color: var(--accent) }
.slider { display: grid; grid-template-columns: minmax(0, 1fr) 56px; gap: 4px 12px; align-items: center }
.slider output { font-family: var(--font-data); text-align: right }
.slider label { grid-column: 1 / -1; font-size: 12.5px; font-weight: 500 }

/* quality */
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; background: var(--surface) }
.drop.over { border-color: var(--accent); background: var(--accent-soft) }
.checks { display: flex; gap: 8px; flex-wrap: wrap }
.spark { width: 72px; height: 22px; color: var(--accent) }
tr.na td { color: var(--muted) }

dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px) }
dialog::backdrop { background: rgba(8, 20, 22, .45) }
dialog .in { padding: 18px; display: flex; flex-direction: column; gap: 12px }
dialog.sheet { margin-right: 0; margin-top: 0; height: 100vh; max-height: 100vh; border-radius: 12px 0 0 12px; width: min(520px, 100vw) }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 12px; font-size: 13px }
.kv dt { color: var(--muted) } .kv dd { margin: 0 }
.note { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 50 }

@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)) } .s4, .s5, .s7 { grid-column: span 6 } .s8 { grid-column: span 12 } .scribe { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .rail { position: sticky; height: auto; flex-direction: row; align-items: center; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 10px; padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5; gap: 12px }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
  .navgroup { flex-direction: row } .navgroup .eyebrow, .rail .foot, .brand b + span { display: none }
  .s4, .s5, .s6, .s7, .s8 { grid-column: span 12 }
  .bigfig { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .soap, .formgrid { grid-template-columns: minmax(0, 1fr) }
}
@media (max-width: 480px) { .tiles { grid-template-columns: minmax(0, 1fr) } .ribbonrow { grid-template-columns: 70px minmax(0, 1fr) 64px } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
// Rebrand for a specific client here (kept generic in the published page).
const HOSPITAL = "Demo Multispecialty Hospital · Al Ain";
document.getElementById("hospname").textContent = HOSPITAL;

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261126);
const pick = (a, r = R) => a[Math.floor(r() * a.length)];
const between = (a, b, r = R) => a + Math.floor(r() * (b - a + 1));
const TODAY = new Date(); TODAY.setHours(11, 20, 0, 0); // demo clock: late morning
const dstr = d => d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
const charts = {};
function chart(id, config) {
  charts[id]?.destroy();
  const c = document.getElementById(id); if (!c || !window.Chart) return;
  Chart.defaults.color = css("--muted"); Chart.defaults.borderColor = css("--line"); Chart.defaults.font.family = "IBM Plex Sans, system-ui, sans-serif";
  const o = config.options || {};
  charts[id] = new Chart(c, { ...config, options: { responsive: true, maintainAspectRatio: false, animation: false, ...o, plugins: { legend: { display: false }, ...(o.plugins || {}) } } });
}
const claudeUse = name => window.claude?.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null);

/* ---------------- synthetic hospital ---------------- */
const DEPTS = [
  { id: "card", name: "Cardiology", docs: ["Dr. Hassan Al Marzouqi", "Dr. Meera Pillai"], reasons: ["Chest pain review", "Palpitations", "Post-angioplasty follow-up", "Hypertension review"] },
  { id: "ortho", name: "Orthopaedics", docs: ["Dr. Khalid Al Ameri", "Dr. Stefan Novak"], reasons: ["Knee pain", "Low back pain", "Fracture follow-up", "Shoulder stiffness"] },
  { id: "obg", name: "Obstetrics & Gynaecology", docs: ["Dr. Layla Haddad", "Dr. Sunita Rao"], reasons: ["Antenatal visit", "Pelvic pain", "PCOS follow-up", "Postnatal check"] },
  { id: "paed", name: "Paediatrics", docs: ["Dr. Omar Farouk", "Dr. Grace Mensah"], reasons: ["Fever", "Vaccination", "Asthma review", "Growth check"] },
  { id: "im", name: "Internal Medicine", docs: ["Dr. Ahmed Saleh", "Dr. Rebecca Thomas"], reasons: ["Diabetes review", "Fatigue", "Thyroid follow-up", "Annual check-up"] },
  { id: "surg", name: "General Surgery", docs: ["Dr. Yousef Al Hammadi", "Dr. Arjun Menon"], reasons: ["Hernia consult", "Gallstones", "Post-op wound check", "Breast lump"] },
  { id: "ent", name: "ENT", docs: ["Dr. Nadia Karam"], reasons: ["Sinusitis", "Hearing loss", "Tonsillitis"] },
  { id: "derm", name: "Dermatology", docs: ["Dr. Hind Al Suwaidi"], reasons: ["Eczema", "Acne", "Mole check"] },
  { id: "oph", name: "Ophthalmology", docs: ["Dr. Faisal Qureshi"], reasons: ["Diabetic eye screen", "Blurred vision", "Cataract review"] },
];
const FIRST_M = ["Ahmed", "Mohammed", "Khalid", "Omar", "Saeed", "Hamdan", "Yousef", "Ali", "Rajesh", "Joseph", "Arjun", "John", "Tariq", "Imran", "Rashid"];
const FIRST_F = ["Fatima", "Mariam", "Aisha", "Noura", "Hessa", "Shamma", "Layla", "Sara", "Priya", "Maria", "Anjali", "Grace", "Reem", "Amna"];
const LAST = ["Al Dhaheri", "Al Ketbi", "Al Ameri", "Al Shamsi", "Al Nuaimi", "Al Mansoori", "Al Kaabi", "Khan", "Nair", "Thomas", "Santos", "Haddad", "Mansour", "Kumar", "Fernandes", "Hussain"];
const NATS = ["UAE", "UAE", "UAE", "India", "Pakistan", "Philippines", "Egypt", "Jordan", "UK"];
const PAYERS = ["Thiqa", "Thiqa", "Daman Enhanced", "Daman Basic", "AXA", "NAS", "Self-pay"];
const ALLERGY = ["No known allergies", "No known allergies", "No known allergies", "Penicillin", "Sulfonamides", "Peanuts", "Latex"];
const PROBLEMS = ["Type 2 diabetes", "Hypertension", "Asthma", "Hypothyroidism", "Dyslipidaemia", "Osteoarthritis", "Iron deficiency anaemia", "GERD"];

const patients = Array.from({ length: 64 }, (_, i) => {
  const sex = R() < .5 ? "M" : "F";
  const age = between(1, 86);
  const nat = pick(NATS);
  const visits = Array.from({ length: between(1, 4) }, () => { const d = pick(DEPTS); const dt = new Date(TODAY); dt.setDate(dt.getDate() - between(3, 400)); return { date: dt, dept: d.name, doctor: pick(d.docs), reason: pick(d.reasons) }; }).sort((a, b) => b.date - a.date);
  return {
    mrn: "MRN-" + (104200 + i * 37), name: `${pick(sex === "M" ? FIRST_M : FIRST_F)} ${pick(LAST)}`, sex, age, nat,
    payer: nat === "UAE" ? pick(["Thiqa", "Thiqa", "Daman Enhanced"]) : pick(PAYERS.slice(2)),
    allergy: pick(ALLERGY), problems: age > 35 ? [...new Set([pick(PROBLEMS), pick(PROBLEMS)])].slice(0, between(0, 2)) : [],
    phone: "05" + between(0, 8) + " ••• •" + between(100, 999), visits, notes: []
  };
});
patients[0] = { ...patients[0], name: "Rashid Al Kaabi", sex: "M", age: 54, nat: "UAE", payer: "Thiqa", allergy: "No known allergies", problems: ["Type 2 diabetes", "Hypertension"] };

// Clinics today
const STATUS = ["Booked", "Arrived", "In consult", "Done"];
const appts = [];
DEPTS.forEach(d => d.docs.forEach(doc => {
  for (let m = 8 * 60; m < 16 * 60; m += 20) {
    if (R() > .72) continue;
    const p = pick(patients), mins = m - (11 * 60 + 20);
    let s = mins > 10 ? "Booked" : mins > -10 ? pick(["Arrived", "In consult"]) : mins > -40 ? pick(["In consult", "Done", "Done"]) : "Done";
    if (mins < -10 && R() < .07) s = "No-show";
    appts.push({ time: `${String(m / 60 | 0).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`, mrn: p.mrn, name: p.name, dept: d.name, doctor: doc, reason: pick(d.reasons), status: s });
  }
}));
appts.sort((a, b) => a.time.localeCompare(b.time));

const WARDS = [{ id: "MW", name: "Medical Ward", n: 24, occ: .92 }, { id: "SW", name: "Surgical Ward", n: 20, occ: .82 }, { id: "PW", name: "Paediatric Ward", n: 12, occ: .6 }, { id: "MAT", name: "Maternity", n: 14, occ: .72 }, { id: "ICU", name: "Intensive Care", n: 10, occ: .9 }, { id: "CCU", name: "Cardiac Care", n: 6, occ: .67 }];
const beds = WARDS.flatMap(w => Array.from({ length: w.n }, (_, i) => {
  const x = R(); const p = pick(patients);
  const state = x < w.occ * .78 ? "occ" : x < w.occ ? "dc" : x < w.occ + .05 ? "clean" : x < .985 ? "free" : "blocked";
  return { ward: w.id, label: `${w.id}-${String(i + 1).padStart(2, "0")}`, state, mrn: p.mrn, name: p.name, los: between(0, 9), dept: pick(DEPTS).name };

/* ---------------- routing ---------------- */
const views = {};

function route() {
  let id = location.hash.slice(1);

  $$("a.nav").forEach(a => a.getAttribute("href") === "#" + id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const v = views[id]; const el = $("#v-" + id);
  if (!inited.has(id)) { v.init(el); inited.add(id); }
  v.show?.(el);
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { const id = location.hash.slice(1) || "overview"; views[id]?.show?.($("#v-" + id)); });
new MutationObserver(() => { const id = location.hash.slice(1) || "overview"; views[id]?.show?.($("#v-" + id)); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function sampleExtract() {
  const r = rng(7), MONS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const H = ["Pt ID", "Visit Type", "Adm. Date", "Disch Date", "Dept.", "Discharge Status", "Fall w/ Injury", "Pressure Ulcer", "CL Days", "CLABSI", "Foley Days", "CAUTI", "Vent Days", "VAE", "Procedure", "SSI", "Abx within 60 min", "Mode of Delivery", "D2B (min)", "Door-to-needle (min)", "C. diff (HO)", "MDRO BSI"];
  const PROCS = ["Lap. cholecystectomy", "47562", "Open cholecystectomy", "Appendectomy", "44970", "44950", "Inguinal hernia repair", "ORIF femur", "Total knee replacement"];
  const p2 = n => String(n).padStart(2, "0");
  const fd = (t, st) => { const d = new Date(t); const Y = d.getFullYear(), M = p2(d.getMonth() + 1), D = p2(d.getDate()), hm = `${p2(d.getHours())}:${p2(d.getMinutes())}`;
    return [`${Y}-${M}-${D} ${hm}`, `${D}/${M}/${Y} ${hm}`, `${D}-${MONS[d.getMonth()]}-${Y}`, `${D}.${M}.${Y} ${hm}`][st]; };
  const yes = () => pick(["Y", "Yes", "1", "TRUE", "y"], r), no = () => pick(["N", "No", "0", "", "FALSE", ""], r);
  const pts = Array.from({ length: 1100 }, (_, i) => "P" + (50000 + i));
  const start = new Date(2025, 9, 1).getTime(), span = new Date(2026, 8, 30).getTime() - start;
  const rows = [];
  const add = (pid, kind, t0, followUp) => {
    const st = Math.floor(r() * 4), row = Array(H.length).fill("");
    row[0] = r() < .01 ? "" : pid;
    row[1] = pick({ ED: ["ER", "Emergency", "ED", "A&E"], IP: ["IP", "Inpatient", "In-Patient", "Admission"], OP: ["OPD", "Outpatient", "Clinic"] }[kind], r);
    row[2] = fd(t0, st);
    if (kind === "ED") {
      const hrs = .7 + r() * r() * 9; row[3] = fd(t0 + hrs * 36e5, st); row[4] = "Emergency";
      row[5] = r() < .022 ? pick(["LWBS", "Left without being seen"], r) : r() < .004 ? "Expired" : pick(["Discharged home", "Admitted", "DC home", "Transferred"], r);
      if (r() < .015) row[18] = between(55, 135, r); if (r() < .01) row[19] = between(32, 95, r);

      const ob = r() < .16; row[4] = ob ? pick(["OB/GYN", "Obstetrics", "Maternity"], r) : pick(["Medicine", "Surgery", "Cardiology", "Orthopaedics", "Paediatrics", "ICU"], r);
      row[5] = r() < .015 ? pick(["Died", "Expired", "Death"], r) : r() < .013 ? pick(["LAMA", "DAMA", "Against medical advice"], r) : pick(["Discharged", "Home", "Discharged home", "Transfer out"], r);
      row[6] = r() < .004 ? yes() : no(); row[7] = r() < .006 ? yes() : no();
      const t0m = new Date(t0).getMonth(); // a cluster of line infections in one month, for the demo chart
      if (r() < .15) { row[8] = between(2, 9, r); row[9] = r() < (t0m === 4 ? .08 : .008) ? yes() : no(); }
      if (r() < .3) { row[10] = between(1, 6, r); row[11] = r() < .006 ? yes() : no(); }
      if (r() < .05) { row[12] = between(4, 10, r); row[13] = r() < .03 ? yes() : no(); }
      row[20] = r() < .003 ? yes() : no(); row[21] = r() < .002 ? yes() : no();

async function readFile(file) {
  if (file.size > 25 * 1024 * 1024) throw new Error("This file is larger than 25 MB. Split it by quarter and load each part.");
  const ext = file.name.split(".").pop().toLowerCase();
  if (["xlsx", "xls", "xlsm", "ods"].includes(ext)) {
    if (!window.XLSX) throw new Error("The spreadsheet reader did not load. Save the sheet as CSV and try again.");
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    const sheet = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: "", raw: true })).sort((a, b) => b.length - a.length)[0]; // largest sheet
    return sheet || [];
  }
  const text = await file.text();
  if (ext === "json") { const j = JSON.parse(text); const arr = Array.isArray(j) ? j : Object.values(j).find(Array.isArray) || []; const keys = [...new Set(arr.flatMap(o => Object.keys(o || {})))]; return [keys, ...arr.map(o => keys.map(k => o?.[k]))]; }
  if (!window.Papa) throw new Error("The CSV reader did not load. Reload the page and try again.");
  return Papa.parse(text, { skipEmptyLines: false }).data;
}

const mKey = r => { const d = r.disch || r.admit; return d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}` : null; };
// Monthly rate against the range expected from the period's own average (wider in months with fewer device or patient days).
function drawMonthly() {

  const pts = months.map(m => k.calc(Q.recs.filter(r => mKey(r) === m)) || { num: 0, den: 0, value: 0 });

  const vals = pts.map(p => +p.value.toFixed(2)), above = vals.filter((v, i) => hi[i] != null && v > hi[i]).length;
  const lab = months.map(m => new Date(+m.slice(0, 4), +m.slice(5) - 1, 1).toLocaleDateString("en-GB", { month: "short", year: "2-digit" }));
  const A = css("--accent"), B = css("--bad"), M = css("--muted");
  chart("c-qm", { type: "line", data: { labels: lab, datasets: [
    { label: "Expected range", data: hi, borderColor: M, borderDash: [4, 4], borderWidth: 1.2, pointRadius: 0, stepped: "middle" },
    { label: "Lower expected", data: lo, borderColor: M, borderDash: [4, 4], borderWidth: 1.2, pointRadius: 0, stepped: "middle", backgroundColor: A + "14", fill: "-1" },
    { label: "Average", data: months.map(() => +(1000 * u).toFixed(2)), borderColor: M, borderWidth: 1, pointRadius: 0 },
    { label: k.name, data: vals, borderColor: A, borderWidth: 2.2, pointRadius: 4, pointBackgroundColor: vals.map((v, i) => hi[i] != null && v > hi[i] ? B : A), pointBorderColor: vals.map((v, i) => hi[i] != null && v > hi[i] ? B : A) }] },
    options: { plugins: { legend: { display: true, position: "bottom", labels: { boxWidth: 12, filter: i => i.datasetIndex !== 1 } } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, title: { display: true, text: k.unit } } } } });
  note.textContent = `${fmt(N)} events over ${fmt(D)} ${k.unit.replace("per 1,000 ", "")} in ${months.length} months. ${above ? `${above} month${above > 1 ? "s" : ""} above the expected range: worth a case review.` : "Every month sits inside the expected range, so month-to-month movement is normal variation."}`;
}

/* ---------------- patient journey (current vs projected) ---------------- */
const JOURNEYS = {
  ed: { name: "Emergency department", volume: 48000, unit: "visits a year", stages: [["Registration", 5, 12, 4], ["Triage", 6, 18, 6], ["Doctor assessment", 15, 42, 15], ["Tests and results", 20, 75, 35], ["Decision", 10, 35, 15], ["Ward bed or departure", 5, 110, 45]] },
  opd: { name: "Outpatient clinic visit", volume: 260000, unit: "visits a year", stages: [["Check-in", 3, 14, 3], ["Vitals", 5, 16, 5], ["Consultation", 14, 38, 12], ["Investigations", 12, 45, 20], ["Pharmacy and billing", 6, 28, 8]] },
  dc: { name: "Inpatient discharge day", volume: 14000, unit: "discharges a year", stages: [["Discharge summary", 25, 120, 30], ["Medicines reconciled", 15, 90, 30], ["Insurance approval", 10, 150, 45], ["Patient leaves", 5, 60, 15], ["Bed ready for next patient", 30, 55, 20]] },
};
const J = { id: "ed", progress: 70 };
views.journey = {
  init(el) {
    el.innerHTML = head("Patient journey", "Where each patient's time goes today, and where it would go after the redesign. Solid: time receiving care. Striped: time waiting.", '<span class="tag sim">Projection · demo data</span>') + `
    <div class="panel"><div class="row"><div class="seg" id="jsel" role="group" aria-label="Journey">${Object.entries(JOURNEYS).map(([k, j]) => `<button data-j="${k}" aria-pressed="${k === J.id}">${j.name}</button>`).join("")}</div></div>
      <div class="slider"><label for="jprog">Implementation progress</label><input type="range" id="jprog" min="0" max="100" step="5" value="${J.progress}"><output id="jprog-o"></output></div></div>
    <div class="panel" id="jbody"></div>
    <div class="grid"><div class="panel s12"><header><h3>Emergency arrivals vs clinician capacity by hour</h3><span class="small muted" id="capnote"></span></header><div class="chart tall"><canvas id="c-cap"></canvas></div></div></div>`;
    $$("#jsel button").forEach(b => b.addEventListener("click", () => { J.id = b.dataset.j; $$("#jsel button").forEach(x => x.setAttribute("aria-pressed", x === b)); this.show(); }));
    $("#jprog").addEventListener("input", e => { J.progress = +e.target.value; this.show(); });
  },
  show() {
    const j = JOURNEYS[J.id], f = J.progress / 100;
    $("#jprog-o").textContent = J.progress + "%";
    const cur = j.stages.map(([n, c, w]) => ({ n, c, w })), prj = j.stages.map(([n, c, w, t]) => ({ n, c, w: Math.round(w - (w - t) * f) }));
    const tot = a => sum(a, s => s.c + s.w), care = a => sum(a, s => s.c);
    const T0 = tot(cur), T1 = tot(prj), mx = T0;
    const hm = m => m >= 90 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m} min`;
    const rib = (a, label) => `<div class="ribbonrow"><span class="small"><b>${label}</b></span><div class="ribbon" style="width:${(100 * tot(a) / mx).toFixed(2)}%">${a.map(s => `<div class="care" style="width:${(100 * s.c / tot(a)).toFixed(2)}%" title="${esc(s.n)}: ${s.c} min care"></div><div class="wt" style="width:${(100 * s.w / tot(a)).toFixed(2)}%" title="${esc(s.n)}: ${s.w} min waiting">${s.w >= 20 ? s.w : ""}</div>`).join("")}</div><span class="num small r">${hm(tot(a))}</span></div>`;
    const saved = T0 - T1, hours = Math.round(saved * j.volume / 60);
    $("#jbody").innerHTML = `<header><h3>${esc(j.name)}</h3><span class="small muted">${fmt(j.volume)} ${j.unit}</span></header>
      <div class="bigfig"><div><span class="eyebrow">Time per patient</span><b>${hm(T0)} → ${hm(T1)}</b></div><div><span class="eyebrow">Share of time receiving care</span><b>${Math.round(100 * care(cur) / T0)}% → ${Math.round(100 * care(prj) / T1)}%</b></div>
        <div><span class="eyebrow">Time given back per patient</span><b>${hm(saved)}</b></div><div><span class="eyebrow">Patient hours released a year</span><b>${fmt(hours)}</b></div></div>
      <div style="display:flex;flex-direction:column;gap:10px">${rib(cur, "Today")}${rib(prj, "Projected")}</div>
      <div class="legend"><span><i style="background:var(--accent);border-color:transparent"></i>Receiving care</span><span><i class="" style="background:var(--wait-soft);border-color:var(--wait)"></i>Waiting</span></div>
      <div class="tablewrap"><table><thead><tr><th>Step</th><th class="r">Care (min)</th><th class="r">Waiting today</th><th class="r">Waiting projected</th><th>Change</th></tr></thead><tbody>
      ${cur.map((s, i) => { const d = s.w - prj[i].w; return `<tr><td>${esc(s.n)}</td><td class="r num">${s.c}</td><td class="r num">${s.w}</td><td class="r num">${prj[i].w}</td><td>${d > 0 ? `<span class="chip good">−${d} min</span>` : '<span class="chip">no change</span>'}${s.w === Math.max(...cur.map(x => x.w)) ? ' <span class="chip warn">longest wait today</span>' : ""}</td></tr>`; }).join("")}
      </tbody></table></div>`;
    // hourly capacity: same total clinician hours, redistributed to match arrivals
    const RATE = 2; // patients per clinician-hour
    const docsNow = ED_SHAPE.map((_, h) => h < 8 ? 2 : h < 20 ? 4 : 3), totalDocH = sum(docsNow, x => x), wsum = sum(ED_SHAPE, x => x);
    const docsNew = ED_SHAPE.map((w, h) => docsNow[h] + (Math.max(1, Math.round(2 * totalDocH * w / wsum) / 2) - docsNow[h]) * f);
    const over = docs => edExpected.filter((d, h) => d > docs[h] * RATE).length;
    $("#capnote").textContent = `Hours where arrivals exceed capacity: ${over(docsNow)} today → ${over(docsNew)} projected, with the same total clinician hours`;
    chart("c-cap", { type: "bar", data: { labels: ED_SHAPE.map((_, h) => String(h).padStart(2, "0") + ":00"), datasets: [
      { label: "Expected arrivals", data: edExpected.map(v => +v.toFixed(1)), backgroundColor: edExpected.map((d, h) => d > docsNow[h] * RATE ? css("--wait") : css("--surface-2")), borderColor: css("--line"), borderWidth: 1, borderRadius: 3, order: 3 },
      { label: "Capacity today", type: "line", data: docsNow.map(d => d * RATE), stepped: "middle", borderColor: css("--muted"), borderDash: [5, 4], pointRadius: 0, borderWidth: 2, order: 2 },
      { label: "Capacity projected", type: "line", data: docsNew.map(d => +(d * RATE).toFixed(1)), stepped: "middle", borderColor: css("--accent"), pointRadius: 0, borderWidth: 2.5, order: 1 }] },
      options: { plugins: { legend: { display: true, position: "bottom", labels: { boxWidth: 12 } } }, scales: { y: { beginAtZero: true, title: { display: true, text: "patients per hour" } }, x: { grid: { display: false }, ticks: { maxTicksLimit: 12 } } } } });
  }
};

/* ---------------- forecast ---------------- */
const WEEKDAY = [1.08, 1.06, .98, .96, 1.0, .9, 1.02]; // Sun..Sat
const hist = Array.from({ length: 56 }, (_, i) => { const d = new Date(TODAY); d.setDate(d.getDate() - 56 + i); return { d, v: Math.round(ED_DAY * WEEKDAY[d.getDay()] * (1 + .0009 * i) * (0.93 + R() * .14)) }; });
function forecastDays(n) {
  const resid = [], out = [];
  hist.forEach((h, i) => { if (i >= 28) { const same = [7, 14, 21, 28].map(k => hist[i - k].v); resid.push(h.v - same.reduce((a, b) => a + b) / 4); } });
  const sd = Math.sqrt(sum(resid, x => x * x) / resid.length);
  for (let k = 1; k <= n; k++) { const d = new Date(TODAY); d.setDate(d.getDate() + k);
    const same = hist.filter(h => h.d.getDay() === d.getDay()).slice(-4).map(h => h.v); const m = same.reduce((a, b) => a + b) / same.length * (1 + .0009 * (k + 2));
    out.push({ d, v: m, lo: m - 1.28 * sd * Math.sqrt(1 + k / 14), hi: m + 1.28 * sd * Math.sqrt(1 + k / 14) }); }
  return out;
}
const F = { growth: 6, progress: 70 };
views.forecast = {
  init(el) {
    el.innerHTML = head("Forecast", "Expected demand for the next two weeks, and the bed position over the next 12 months with and without the redesign.", '<span class="tag sim">Projection · demo model</span>') + `
    <div class="grid">
      <div class="panel s8"><header><h3>Emergency arrivals: last 4 weeks and next 14 days</h3><span class="small muted">Shaded band: 80% range</span></header><div class="chart tall"><canvas id="c-fc"></canvas></div></div>
      <div class="panel s4"><header><h3>Next 7 days</h3></header><div class="tablewrap"><table><thead><tr><th>Day</th><th class="r">Expected</th><th class="r">Range</th></tr></thead><tbody id="fc7"></tbody></table></div></div>
      <div class="panel s12"><header><h3>Inpatient bed demand, next 12 months</h3><span class="small muted" id="bednote"></span></header>
        <div class="grid"><div class="s4" style="display:flex;flex-direction:column;gap:14px">
          <div class="slider"><label for="fgrow">Admissions growth per year</label><input type="range" id="fgrow" min="0" max="15" value="${F.growth}"><output id="fgrow-o"></output></div>
          <div class="slider"><label for="fprog">Implementation progress</label><input type="range" id="fprog" min="0" max="100" step="5" value="${F.progress}"><output id="fprog-o"></output></div>
          <div class="bigfig" style="grid-template-columns:1fr 1fr" id="bedfig"></div></div>
          <div class="s8"><div class="chart tall"><canvas id="c-beds"></canvas></div></div></div></div>
    </div>`;
    $("#fgrow").addEventListener("input", e => { F.growth = +e.target.value; this.show(); });
    $("#fprog").addEventListener("input", e => { F.progress = +e.target.value; this.show(); });
  },
  show() {
    const fc = forecastDays(14), lab = d => d.toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short" });
    const recent = hist.slice(-28);
    const L = [...recent.map(h => lab(h.d)), ...fc.map(f => lab(f.d))], pad = Array(28).fill(null), A = css("--accent");
    chart("c-fc", { type: "line", data: { labels: L, datasets: [
      { label: "Actual", data: [...recent.map(h => h.v), ...Array(14).fill(null)], borderColor: css("--muted"), pointRadius: 0, borderWidth: 1.5, tension: .2 },
      { label: "Low", data: [...pad, ...fc.map(f => Math.round(f.lo))], borderColor: "transparent", pointRadius: 0 },
      { label: "High", data: [...pad, ...fc.map(f => Math.round(f.hi))], borderColor: "transparent", backgroundColor: A + "2e", fill: "-1", pointRadius: 0 },
      { label: "Forecast", data: [...pad.slice(1), recent.at(-1).v, ...fc.map(f => Math.round(f.v))], borderColor: A, borderWidth: 2.2, pointRadius: 0, tension: .2 }] },
      options: { interaction: { mode: "index", intersect: false }, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { title: { display: true, text: "arrivals per day" } } } } });
    $("#fc7").innerHTML = fc.slice(0, 7).map(f => `<tr><td>${lab(f.d)}</td><td class="r num">${Math.round(f.v)}</td><td class="r num muted">${Math.round(f.lo)}–${Math.round(f.hi)}</td></tr>`).join("");
    $("#fgrow-o").textContent = F.growth + "%"; $("#fprog-o").textContent = F.progress + "%";
    const BEDS = beds.filter(b => b.state !== "blocked").length, ADM_DAY = 38, ALOS = 3.9;
    const dcSaved = (tot(JOURNEYS.dc, 0) - tot(JOURNEYS.dc, F.progress / 100)) / 60 / 24; // days of bed time freed per discharge
    function tot(j, f) { return sum(j.stages, ([, c, w, t]) => c + w - (w - t) * f); }
    const months = Array.from({ length: 12 }, (_, m) => { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1 + m, 1); return d.toLocaleDateString("en-GB", { month: "short", year: "2-digit" }); });
    const season = m => 1 + .06 * Math.cos((new Date(TODAY.getFullYear(), TODAY.getMonth() + 1 + m, 1).getMonth() - 0) / 12 * 2 * Math.PI); // winter peak
    const need = (m, alos) => ADM_DAY * Math.pow(1 + F.growth / 100, (m + 1) / 12) * season(m) * alos;
    const base = months.map((_, m) => need(m, ALOS)), proj = months.map((_, m) => need(m, ALOS - dcSaved * Math.min(1, (m + 1) / 6)));
    const over = a => a.filter(v => v > BEDS * .9).length;
    $("#bednote").textContent = `${BEDS} beds in service · pressure line at 90%`;
    $("#bedfig").innerHTML = `<div><span class="eyebrow">Months above 90%</span><b>${over(base)} → ${over(proj)}</b></div><div><span class="eyebrow">Beds released (avg)</span><b>${fmt(sum(base, x => x) / 12 - sum(proj, x => x) / 12, 1)}</b></div>
      <div><span class="eyebrow">Stay shortened by</span><b>${fmt(dcSaved * 24, 1)} h</b></div><div><span class="eyebrow">Extra admissions a year</span><b>${fmt((ADM_DAY * 365) * (ALOS / (ALOS - dcSaved) - 1))}</b></div>`;
    chart("c-beds", { type: "line", data: { labels: months, datasets: [
      { label: "Beds needed, current way of working", data: base.map(v => +v.toFixed(1)), borderColor: css("--wait"), borderWidth: 2, pointRadius: 2, tension: .3 },
      { label: "Beds needed, projected", data: proj.map(v => +v.toFixed(1)), borderColor: A, borderWidth: 2.5, pointRadius: 2, tension: .3, backgroundColor: A + "1f", fill: "-1" },
      { label: "90% of beds", data: months.map(() => +(BEDS * .9).toFixed(1)), borderColor: css("--bad"), borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0 }] },
      options: { plugins: { legend: { display: true, position: "bottom", labels: { boxWidth: 12 } } }, scales: { x: { grid: { display: false } }, y: { title: { display: true, text: "occupied beds" } } } } });
  }
};

/* ---------------- self-check of the indicator engine ---------------- */
function selfTest() {
  const eq = (a, b, m) => { if (Math.abs(a - b) > 1e-9) throw new Error(`${m}: expected ${b}, got ${a}`); };
  eq(parseDate("03/02/2026").getMonth(), 1, "day-first date"); eq(parseDate("2026-02-03 14:05").getHours(), 14, "ISO time");
  eq(parseDate("05-Mar-2026").getDate(), 5, "month name"); eq(parseDate(46000).getFullYear(), 2025, "spreadsheet serial"); eq(parseDate("TBC") === null ? 1 : 0, 1, "junk date");
  eq(parseDate("31/02/2026") === null ? 1 : 0, 1, "impossible date");
  const aoa = [["Report"], [], ["MRN", "Patient Type", "Admission Date", "Discharge Date", "Fall w/ Injury"],
    ["A", "Inpatient", "01/01/2026", "05/01/2026", "Y"], ["A", "IP", "20/01/2026", "22/01/2026", "no"], ["A", "IP", "20/01/2026", "22/01/2026", "no"],
    ["B", "ER", "02/01/2026 10:00", "02/01/2026 16:00", ""], ["B", "Emergency", "04/01/2026 09:00", "04/01/2026 10:00", ""]];
  const hdr = findHeaderRow(aoa); eq(hdr, 2, "header row");
  const map = autoMap(aoa[hdr]); const { recs, rep } = cleanRows(aoa.slice(hdr + 1), map);
  eq(rep.dup, 1, "duplicate removed");
  eq(KPIS.find(k => k.id === "readmit").calc(recs).value, 50, "readmission %");
  eq(KPIS.find(k => k.id === "edret").calc(recs).value, 50, "72h return %");
  eq(KPIS.find(k => k.id === "falls").calc(recs).value, 1000 / 6, "falls per 1000 days");
  eq(KPIS.find(k => k.id === "edlos").calc(recs).value, 50, "ED > 4h %");
  eq(["47562", "Appendectomy", "58150", "ORIF femur"].map(procKind).join() === "chole,appy,hyst,other" ? 1 : 0, 1, "SSI procedure groups");
  return "ok";
}
try { window.__selfTest = selfTest(); } catch (e) { window.__selfTest = e.message; console.error("Indicator self-check failed:", e.message); }

route();
